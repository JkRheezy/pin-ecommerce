# Harness 配置文件
# 用于无人值守 Agent 开发

project:
  name: my-project
  description: 多智能体opc电商
  type: node-ts

# LLM 配置 - Kimi For Coding (通过 Anthropic 兼容接口)
# 专为编程优化的模型，支持长上下文（262K）
# 文档: https://www.kimi.com/code/docs/more/third-party-agents.html
llm:
  provider: anthropic  # ✅ 使用 anthropic 兼容接口
  model: kimi-for-coding  # ✅ Coding Plan 专用模型
  # ⚠️ 必须使用 ANTHROPIC_API_KEY 环境变量
  apiKey: ${ANTHROPIC_API_KEY}
  # ⚠️ 必须以 / 结尾
  baseUrl: https://api.kimi.com/coding/
  maxTokens: 32768
  temperature: 0.2
  timeout: 300000
  # 避免 tool_search 导致的 400 错误
  enableToolSearch: false

# 安全边界配置
safety:
  maxExecutionTime: 14400000  # 4小时
  maxErrorRate: 1.0  # 暂时提高到 100%，避免初期调试时停止
  maxComplexity: 10

# 检查点配置
checkpoint:
  enabled: true
  interval: 300000

# Superpowers 技能配置
superpowers:
  enabled: true
  # 使用系统 skill 路径（支持所有内置技能）
  skillsPath: C:\Users\czy\.config\agents\skills

# PR 自动化配置
pr:
  autoCreate: true
  autoReview: true
  autoMerge: false

# LangGraph 编排配置
orchestration:
  # 人工审核：在关键节点暂停等待人工确认
  enableHumanReview: false
  reviewTimeoutMs: 300000  # 5分钟
  autoApproveAfterTimeout: false
  
  # 并行执行：同时执行多个独立任务
  enableParallelExecution: false
  maxParallelAgents: 3
  
  # A/B 测试：自动对比不同策略效果
  enableABTesting: false

# GitHub 配置
# Token 请通过环境变量 GITHUB_TOKEN 设置
github:
  repo: JkRheezy/pin-ecommerce
  token: ${GITHUB_TOKEN}

# Evolution 配置 - 控制自动进化策略
evolution:
  enabled: true
  checkInterval: 300000
  maxOpportunitiesPerAnalysis: 5
  minImpactThreshold: 5
  categories:
    technical: true    # 技术债务（代码质量、重构）
    business: true     # 业务功能（需要配置 businessContext）
    ux: true           # 用户体验

# 业务上下文 - 让 Loop 理解业务需求并生成功能代码
businessContext:
  domain: "e-commerce"  # 领域：电商
  goals:
    - "实现多智能体选品系统"
    - "集成 Reddit/Google Trends 趋势分析"
    - "提供产品创意生成功能"
    - "支持一键上架到电商平台"
  userFlows:
    - name: "趋势发现"
      steps: ["浏览趋势", "选择品类", "查看详情"]
    - name: "产品创意"
      steps: ["生成创意", "评估可行性", "保存方案"]
    - name: "选品决策"
      steps: ["AI推荐", "人工确认", "批量导出"]
  constraints:
    - "必须支持中文界面"
    - "响应时间 < 3秒"
    - "支持移动端访问"

# 通知配置
notifications:
  slack:
    webhook: ${SLACK_WEBHOHOOK_URL}
