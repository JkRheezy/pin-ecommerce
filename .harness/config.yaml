# Harness 配置文件
# 用于无人值守 Agent 开发

project:
  name: my-project
  description: 多智能体opc电商
  type: node-ts

# LLM 配置 - Kimi For Coding (通过 Anthropic 兼容接口)
# 专为编程优化的模型，支持长上下文（262K）
# 文档: https://www.kimi.com/code/docs/more/third-party-agents.html
llm:
  provider: anthropic  # ✅ 使用 anthropic 兼容接口
  model: kimi-for-coding  # ✅ Coding Plan 专用模型
  # ⚠️ 必须使用 ANTHROPIC_API_KEY 环境变量
  apiKey: ${ANTHROPIC_API_KEY}
  # ⚠️ 必须以 / 结尾
  baseUrl: https://api.kimi.com/coding/
  maxTokens: 32768
  temperature: 0.2
  timeout: 300000
  # 避免 tool_search 导致的 400 错误
  enableToolSearch: false

# 安全边界配置
safety:
  maxExecutionTime: 14400000  # 4小时
  maxErrorRate: 1.0  # 暂时提高到 100%，避免初期调试时停止
  maxComplexity: 10

# 检查点配置
checkpoint:
  enabled: true
  interval: 300000

# Superpowers 技能配置
superpowers:
  enabled: true
  # 使用系统 skill 路径（支持所有内置技能）
  skillsPath: C:\Users\czy\.config\agents\skills

# PR 自动化配置
pr:
  autoCreate: true
  autoReview: true
  autoMerge: false

# LangGraph 编排配置
orchestration:
  # 人工审核：在关键节点暂停等待人工确认
  enableHumanReview: false
  reviewTimeoutMs: 300000  # 5分钟
  autoApproveAfterTimeout: false
  
  # 并行执行：同时执行多个独立任务
  enableParallelExecution: false
  maxParallelAgents: 3
  
  # A/B 测试：自动对比不同策略效果
  enableABTesting: false

# GitHub 配置
# Token 请通过环境变量 GITHUB_TOKEN 设置
github:
  repo: JkRheezy/pin-ecommerce
  token: ${GITHUB_TOKEN}

# 通知配置
notifications:
  slack:
    webhook: ${SLACK_WEBHOHOOK_URL}
